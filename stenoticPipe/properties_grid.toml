        noSolvers                       = 2
        multiSolverGrid                 = true
# -------------- APPLICATION SETTINGS  --------------
        flowSolver                      = false   
        gridGenerator                   = true    
        scratchSize                     = 30.0
        dynamicLoadBalancing            = false
# -------------- APPLICATION ENVIRONMENT  --------------
        outputDir                       = "./out/"       
        geometryInputFileName           = "geometry.toml"
	gridOutputFileName              = "grid.Netcdf"  
        gridInputFileName               = "grid.Netcdf"  
# -------------- SPATIAL DISCRETIZATION --------------
        spaceDimensions                 = 3              
# -------------- GRID AND REFINEMENT PROPERTIES --------------  
        maxNoCells                      = 3000000     #Maximale Zellanzahl
        minLevel                        = 8            #Initielles Verfeinerungslevel
        maxUniformRefinementLevel       = 8            #Maximales Verfeinerungslevel für die Geo.
        maxRfnmntLvl                    = 10           #Maximales Verfeinerungslevel
        maxBoundaryRfnLvl               = 10           #Maximales Verfeinerungslevel des Randes
# -------------- REFINEMENT OF THE MESH --------------
        # Set the special refinement type: 0 deactivated, 1 patch only, 2 boundary only, 3 both.
        localRfnMethod                  = 2

        localBndRfnMethod               = 0 #2        
        smoothDistance                  = 3
        localMinBoundaryThreshold       = 2
        localBndRfnDistance             = 0.5 #0.5
        localRfnBoundaryIds             = 2

        localRfnLvlMethods              = "B-B"
        localRfnLevelProperties         = [-90.000, -10.000, -10.000, 20.000, 10.000, 10.000, 
                                           -56.000, -10.000, -10.000, 0.000, 10.000, 10.000]
#-------------------PARTITIONING--------------------
        # Weight higher level more than lower due to dx~dt nature of LB
        # However, limit to ~1/4 on coarser levels to limit maxNoCells/partition
        # (just rule of thumb and open to be tuned for optimal balanced case)
        partitionCellOffspringThreshold = 100000
        weightMethod                    = 3 # 0: all have 1, 3: set weights per level
        setWeightValue                  = [2.5, 1.7, 1.0]
